name: Refresh portfolio data and deploy

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data/projects.json'
      - 'screenshots/**'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: portfolio-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm i --no-audit --no-fund; fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build data/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
          PORTFOLIO_ORG: ${{ vars.PORTFOLIO_ORG || 'imagine-os' }}
          PORTFOLIO_USERS: ${{ vars.PORTFOLIO_USERS }}
          PORTFOLIO_EXTRA_REPOS: ${{ vars.PORTFOLIO_EXTRA_REPOS }}
        run: node scripts/build-data.mjs

      - name: Screenshot live sites
        run: node scripts/screenshot.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json screenshots
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: refresh portfolio data [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # re-checkout so the fresh data commit from `refresh` is included

      - uses: actions/configure-pages@v5

      - name: Drop non-site files from the artifact
        run: rm -rf node_modules .git

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
